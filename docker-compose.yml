# Local development infrastructure for the Tier 1 Self-Healing Data
# Pipeline demo: PostgreSQL (the audit-of-record for repair_episodes /
# repair_events) and a self-hosted MLflow Tracking Server backed by that
# same PostgreSQL instance. These are LOCAL DEVELOPMENT credentials and
# defaults only — see the security note in .env.example.
#
# Hostname note: the host application (running outside Docker) connects
# to PostgreSQL and MLflow via "localhost" and their published ports
# (DB_PORT / MLFLOW_PORT). The MLflow *container* connects to PostgreSQL
# using the Docker Compose service name "postgres" instead — container
# networking has its own internal DNS, where "localhost" would mean the
# MLflow container itself, not the postgres container. That's why the
# MLflow service's --backend-store-uri below uses "postgres:5432", not
# "${DB_HOST}:${DB_PORT}".

services:
  postgres:
    image: postgres:16-alpine
    container_name: self-healing-pipeline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-self_healing_pipeline}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-self_healing_pipeline}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mlflow:
    build:
      context: ./docker
      dockerfile: mlflow.Dockerfile
    container_name: self-healing-pipeline-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-self_healing_pipeline}
      --default-artifact-root /mlartifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Observability: centralized application log search (Elasticsearch +
  # Kibana), fed by Filebeat tailing the app's existing structured JSON log
  # file. This is additive: MLflow remains the LLM/workflow tracing system
  # of record, PostgreSQL remains the repair audit system of record — this
  # stack only indexes the application's existing structured *logs* for
  # search/filtering/dashboards. Security is left at its 7.x default (off)
  # since this is local-development-only, matching every other service
  # above (no production credentials here either).
  elasticsearch:
    # 7.17.0's bundled JDK has a bug in its cgroup v2 parser that crashes
    # the launcher's *bootstrap* JVM (computing JVM options) before
    # ES_JAVA_OPTS is even applied — `-XX:-UseContainerSupport` and
    # `cgroup: host` can't reach that code path. A later 7.17.x patch
    # bundles a JDK with this fixed; pinned to a specific patch (not
    # `:7.17` floating) so this stays reproducible. Same minor version as
    # Kibana below — Elastic guarantees 7.17.x patch-level compatibility.
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    container_name: self-healing-pipeline-elasticsearch
    restart: unless-stopped
    cgroup: host
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m -XX:-UseContainerSupport"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    container_name: self-healing-pipeline-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.0
    container_name: self-healing-pipeline-filebeat
    restart: unless-stopped
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/logs:ro
      - filebeat_data:/usr/share/filebeat/data
    command: ["--strict.perms=false", "-e"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:5066/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  mlflow_artifacts:
  es_data:
  filebeat_data:
